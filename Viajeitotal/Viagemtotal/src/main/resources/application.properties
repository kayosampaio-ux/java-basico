spring.application.name=crud-produtos

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/crud_produtos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Servidor
server.port=8080

# DevTools
spring.devtools.restart.enabled=true